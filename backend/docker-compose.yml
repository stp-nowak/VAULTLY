# Backend with everything only it needs. No backend service has an API project yet, so today this is its database.
#   docker compose -f backend/docker-compose.yml up
# Shares the `vaultly` project (and so its network) with the other Vaultly compose files; see ../docker-compose.yml.
name: vaultly

services:
  backend-db:
    container_name: vaultly-backend-db
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaultly_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - backend-db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the image's init-time temporary server answers on the socket only, before the real server is up.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres --dbname vaultly_backend"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  backend-db-data:
