name: Vulnerability report

# Reports known vulnerabilities in NuGet and pnpm dependencies in each job's summary and fails on high or critical
# ones; scans the Docker images without failing. The weekly run catches advisories published after the dependencies
# were added.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  nuget:
    name: NuGet (${{ matrix.solution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - core/src/Vaultly.Core.slnx
          - auth/src/Vaultly.Auth.slnx
          - gateway/src/Vaultly.Gateway.slnx
          - accounts/src/Vaultly.Accounts.slnx
          - transactions/src/Vaultly.Transactions.slnx
          - web/src/api/Vaultly.Web.Api.slnx
    env:
      SOLUTION: ${{ matrix.solution }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - run: dotnet restore "$SOLUTION"
      - name: Report vulnerable packages
        run: |
          dotnet list "$SOLUTION" package --vulnerable --include-transitive --format json > nuget-vulnerabilities.json
          jq -r --arg solution "$SOLUTION" '
            [ .projects[]
              | (.path | split("/") | last) as $project
              | .frameworks[]?
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | . as $package
              | .vulnerabilities[]
              | [$project, $package.id, $package.resolvedVersion, .severity, .advisoryurl] ] | unique as $rows
            | "### NuGet: \($solution)\n",
              (if ($rows | length) == 0
               then "No known vulnerable packages."
               else ("| Project | Package | Version | Severity | Advisory |\n|---|---|---|---|---|",
                     ($rows[] | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) | \(.[4]) |"))
               end)
          ' nuget-vulnerabilities.json >> "$GITHUB_STEP_SUMMARY"
          blocking=$(jq '[.. | .severity? // empty | select(. == "High" or . == "Critical")] | length' nuget-vulnerabilities.json)
          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking high or critical vulnerabilities in $SOLUTION"
            exit 1
          fi

  pnpm:
    name: pnpm workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Report vulnerable packages
        run: |
          {
            echo '### pnpm workspace'
            echo '```'
            pnpm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm audit --audit-level high

  # Report only: base image findings are fixed upstream, so they must not block PRs. Results are listed in the job
  # summary and under Security → Code scanning, one category per image.
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth
            build: --build-context core=core/src auth/src
          - name: auth-web
            build: --file auth/web/Dockerfile .
          - name: gateway
            build: --build-context identity-public-types=auth/src/Vaultly.Identity.PublicTypes gateway/src
          - name: accounts
            build: >-
              --build-context core=core/src
              --build-context identity-public-types=auth/src/Vaultly.Identity.PublicTypes
              accounts/src
          - name: transactions
            build: >-
              --build-context core=core/src
              --build-context accounts-public-types=accounts/src/Vaultly.Accounts.PublicTypes
              --build-context identity-public-types=auth/src/Vaultly.Identity.PublicTypes
              transactions/src
          - name: web-api
            build: --build-context identity-api-contracts=auth/src/Vaultly.Identity.ApiContracts web/src/api
          - name: web-spa
            build: --file web/src/web/Dockerfile .
          - name: postgres
            image: postgres:19-alpine
          - name: redis
            image: redis:8-alpine
          - name: rabbitmq
            image: rabbitmq:4-management-alpine
    env:
      IMAGE: ${{ matrix.image || format('vaultly-{0}:scan', matrix.name) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.build
        run: docker build --tag "$IMAGE" ${{ matrix.build }}
      # Pinned to a commit: trivy-action tags were once force-pushed to malicious code.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image:${{ matrix.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy.txt
      - name: Report vulnerable packages
        run: |
          {
            echo "### Image: $IMAGE"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
