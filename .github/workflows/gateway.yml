name: Gateway

# Runs only when the gateway (or this workflow) changes. Other projects have their own workflows,
# so builds of different projects run in parallel.
on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'auth/src/Vaultly.Identity.PublicTypes/**'
      - '.github/workflows/gateway.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'auth/src/Vaultly.Identity.PublicTypes/**'
      - '.github/workflows/gateway.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Vaultly.Gateway.slnx
      - run: dotnet build Vaultly.Gateway.slnx --no-restore --configuration Release
      - run: dotnet test Vaultly.Gateway.slnx --no-build --configuration Release

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-context identity-public-types=auth/src/Vaultly.Identity.PublicTypes gateway/src
