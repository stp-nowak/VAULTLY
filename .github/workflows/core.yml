name: Core

# Runs only when core (or this workflow) changes. Other projects have their own workflows,
# so builds of different projects run in parallel.
on:
  pull_request:
    paths:
      - 'core/**'
      - 'auth/src/Vaultly.Identity.PublicTypes/**'
      - '.github/workflows/core.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'auth/src/Vaultly.Identity.PublicTypes/**'
      - '.github/workflows/core.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Vaultly.Core.slnx
      - run: dotnet build Vaultly.Core.slnx --no-restore --configuration Release
      - run: dotnet test Vaultly.Core.slnx --no-build --configuration Release
