name: Auth service

# Runs only when the Auth service C# code (or this workflow) changes; the login UI (auth/web) has auth-web.yml
# and documentation (auth/docs) needs no build. Other projects have their own workflows,
# so builds of different projects run in parallel.
on:
  pull_request:
    paths:
      - 'auth/**'
      - '!auth/web/**'
      - '!auth/docs/**'
      - '.github/workflows/auth.yml'
  push:
    branches: [main]
    paths:
      - 'auth/**'
      - '!auth/web/**'
      - '!auth/docs/**'
      - '.github/workflows/auth.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Vaultly.Auth.slnx
      - run: dotnet build Vaultly.Auth.slnx --no-restore --configuration Release
      - run: dotnet test Vaultly.Auth.slnx --no-build --configuration Release
