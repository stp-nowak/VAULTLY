name: Web SPA

# Runs when the React SPA, the shared UI package or the workspace setup (or this workflow) changes. Other projects have their own workflows,
# so builds of different projects run in parallel.
on:
  pull_request:
    paths:
      - 'web/src/web/**'
      - 'packages/ui/**'
      - 'accounts/openapi/**'
      - 'transactions/openapi/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/web-spa.yml'
  push:
    branches: [main]
    paths:
      - 'web/src/web/**'
      - 'packages/ui/**'
      - 'accounts/openapi/**'
      - 'transactions/openapi/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/web-spa.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API types are generated from the services' OpenAPI contracts; a contract change the SPA has not picked up
      # fails here, and the typecheck in build fails where the SPA no longer matches it.
      - run: pnpm --filter @vaultly/web api:types
      - name: API types match the contracts
        run: |
          if ! git diff --exit-code -- 'web/src/web/src/**/generated/*.ts'; then
            echo "::error::API types are out of date: run pnpm --filter @vaultly/web api:types and commit"
            exit 1
          fi
      - run: pnpm --filter @vaultly/web lint
      - run: pnpm --filter @vaultly/web test
      - run: pnpm --filter @vaultly/web build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file web/src/web/Dockerfile .
