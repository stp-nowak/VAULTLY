version: 2

# Minor and patch updates come as one grouped PR per ecosystem; each major update gets its own PR, because it may
# need code or migration changes. Security updates are opened as soon as an advisory is published.
updates:
  - package-ecosystem: nuget
    directories:
      - /core/src
      - /auth/src
      - /gateway/src
      - /accounts/src
      - /transactions/src
      - /web/src/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /auth/src
      - /auth/web
      - /gateway/src
      - /accounts/src
      - /transactions/src
      - /web/src/api
      - /web/src/web
    schedule:
      interval: monthly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directories:
      - /infra
      - /auth
      - /accounts
      - /transactions
      - /web
    schedule:
      interval: monthly
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
