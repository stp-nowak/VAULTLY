version: 2

# At most two version-update PRs per ecosystem each week: one for minor and patch updates, one for major updates
# (which may need code changes). Security updates are grouped into one PR per ecosystem as soon as an advisory is
# published. Docker images are not updated here (their vulnerabilities are reported by the `image` job of
# `workflows/vulnerabilities.yml`): their tags (`10.0`, `17-alpine`) already float to the latest patch,
# and a new major (.NET, Node, Postgres) is a deliberate platform upgrade, not a routine bump.
updates:
  - package-ecosystem: nuget
    directories:
      - /core/src
      - /auth/src
      - /gateway/src
      - /accounts/src
      - /transactions/src
      - /web/src/api
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ['*']
      nuget-minor-patch:
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
